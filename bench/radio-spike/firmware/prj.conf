# Our own USB device (VID:PID, serial from DEVICEADDR) instead of the
# board's CDC console backend.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

CONFIG_CLOCK_CONTROL=y
CONFIG_NRFX_GPPI=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_RING_BUFFER=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_RESET_ON_FATAL_ERROR=y

# Enhanced ShockBurst. The firmware holds the HFXO itself.
CONFIG_ESB=y

# A: every linked pipe, phantoms included, holds an ACK payload in
# ESB, and the active pipe up to 4 reports.
CONFIG_ESB_TX_FIFO_SIZE=32
